plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eza.spicyex'
    compileSdk 35

    // Keep focused JVM runs discoverable without moving the existing JUnit4 classes. Groups are
    // intentionally additive: the narrower lyrics-ai and lyrics-session groups sit inside the
    // broad lyrics group, while corpus names identify the golden language fixtures.
    def unitTestGroups = [
            settings: ['com.eza.spicyex.Settings*'],
            diagnostics: ['com.eza.spicyex.diagnostics.*'],
            hooks: ['com.eza.spicyex.hooks.*'],
            lyrics: ['com.eza.spicyex.lyrics.*'],
            'lyrics-ai': ['com.eza.spicyex.lyrics.ai.*'],
            'lyrics-session': ['com.eza.spicyex.lyrics.session.*'],
            corpus: [
                    'com.eza.spicyex.lyrics.ChineseRomanizerTest',
                    'com.eza.spicyex.lyrics.CyrillicRomanizerTest',
                    'com.eza.spicyex.lyrics.GreekRomanizerTest',
                    'com.eza.spicyex.lyrics.JapaneseReadingTest',
                    'com.eza.spicyex.lyrics.JapaneseReadingPolicyConformanceTest',
                    'com.eza.spicyex.lyrics.JapaneseRomajiProjectionConformanceTest',
                    'com.eza.spicyex.lyrics.JapaneseRubyGeometryTest',
                    'com.eza.spicyex.lyrics.JyutpingRomanizerTest',
                    'com.eza.spicyex.lyrics.KoreanPronunciationTest',
                    'com.eza.spicyex.lyrics.KoreanReadingProcessorTest',
                    'com.eza.spicyex.lyrics.KoreanRomanizerTest'
            ]
    ]
    def requestedTestGroup = providers.gradleProperty('testGroup').orNull
    if (requestedTestGroup != null && !unitTestGroups.containsKey(requestedTestGroup)) {
        throw new GradleException("Unknown testGroup '${requestedTestGroup}'. Choose one of: "
                + unitTestGroups.keySet().join(', '))
    }

    def keystorePath = System.getenv("SIGNING_KEYSTORE_FILE")
    def releaseStorePassword = System.getenv("SIGNING_STORE_PASSWORD")
    def releaseKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("SIGNING_KEY_PASSWORD")
    // Release artifacts must retain one signing lineage. Validate the complete credential set, then
    // fail packaging tasks instead of silently producing debug-signed APKs.
    def releaseKeystoreValid = false
    def releaseSigningError = "release signing credentials are missing"
    if (keystorePath != null && !keystorePath.trim().isEmpty()
            && releaseStorePassword != null && !releaseStorePassword.isEmpty()
            && releaseKeyAlias != null && !releaseKeyAlias.trim().isEmpty()
            && releaseKeyPassword != null && !releaseKeyPassword.isEmpty()
            && new File(keystorePath).isFile()) {
        try {
            def ks = java.security.KeyStore.getInstance("JKS")
            new File(keystorePath).withInputStream { ks.load(it, releaseStorePassword.toCharArray()) }
            def key = ks.getKey(releaseKeyAlias, releaseKeyPassword.toCharArray())
            if (!(key instanceof java.security.PrivateKey) || ks.getCertificate(releaseKeyAlias) == null) {
                throw new java.security.KeyStoreException("alias does not contain a private key and certificate")
            }
            releaseKeystoreValid = true
            releaseSigningError = ""
        } catch (Throwable t) {
            releaseSigningError = "release signing credentials are unusable (" + t.class.simpleName + ")"
        }
    }

    gradle.taskGraph.whenReady { graph ->
        def packagesRelease = graph.allTasks.any { task ->
            task.project == project && task.name.toLowerCase(java.util.Locale.ROOT)
                    .matches("(assemble|package|bundle).*release.*")
        }
        if (packagesRelease && !releaseKeystoreValid) {
            throw new GradleException("SpicyEX: ${releaseSigningError}; refusing to create release artifacts.")
        }
    }

    defaultConfig {
        applicationId "com.eza.spicyex"
        minSdk 27
        targetSdk 35
        versionCode 673
        versionName "1.58.398+B673-20260911T0725Z"
        def diagnosticIntakeUrl = providers.gradleProperty("DIAGNOSTIC_INTAKE_URL")
                .orElse("https://reports.eza.dpdns.org/v1/reports")
                .get()
        buildConfigField "String", "DIAGNOSTIC_INTAKE_URL", "\"${diagnosticIntakeUrl}\""

    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    flavorDimensions += "tier"
    productFlavors {
        lite {
            dimension "tier"
            versionNameSuffix "-lite"
            buildConfigField "boolean", "TRANSLITERATION_AVAILABLE", "false"
            buildConfigField "boolean", "TRANSLATION_AVAILABLE", "false"
            buildConfigField "boolean", "APPLE_FONT_AVAILABLE", "false"
        }
        full {
            dimension "tier"
            versionNameSuffix "-full"
            buildConfigField "boolean", "TRANSLITERATION_AVAILABLE", "true"
            buildConfigField "boolean", "TRANSLATION_AVAILABLE", "true"
            buildConfigField "boolean", "APPLE_FONT_AVAILABLE", "true"
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreValid) {
                storeFile file(keystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystoreValid) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.all {
            if (requestedTestGroup != null) {
                filter {
                    unitTestGroups[requestedTestGroup].each { includeTestsMatching(it) }
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/CONTRIBUTORS.md',
                    'META-INF/LICENSE.md',
                    'META-INF/NOTICE.md'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    // Test-runtime copy of the hook API so adapter seam tests can drive a fake
    // interceptor chain on the JVM. Production stays compileOnly (no API in APK).
    testImplementation 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'org.luckypray:dexkit:2.0.0'
    // OkHttp 5 races IPv4/IPv6 (Happy Eyeballs fast fallback, on by default) instead of
    // trying routes in order. Required baseline on networks with a blackholed IPv6 route,
    // where 4.x burned the full connect timeout per new connection. See
    // docs/backlog/HAPPY_EYEBALLS_TRANSPORT_REQUIREMENTS.md.
    implementation 'com.squareup.okhttp3:okhttp:5.0.0'
    fullImplementation 'com.github.pemistahl:lingua:1.2.2'
    fullImplementation 'com.atilika.kuromoji:kuromoji-unidic:0.9.0'
    fullImplementation 'com.belerweb:pinyin4j:2.5.1'
}

// Persist version-stamped debug APKs to <repo>/artifacts/ so installs do not dig through build/.
android.applicationVariants.configureEach { variant ->
    if (variant.buildType.name != 'debug') return
    def cap = variant.name.capitalize()
    tasks.register("copy${cap}Apk", Copy) {
        from layout.buildDirectory.file("outputs/apk/${variant.flavorName}/debug/app-${variant.flavorName}-debug.apk")
        into rootProject.layout.projectDirectory.dir('artifacts')
        rename { "SpicyEX-${variant.flavorName}-debug-${variant.versionName}.apk" }
    }
    tasks.named("assemble${cap}").configure { finalizedBy "copy${cap}Apk" }
}

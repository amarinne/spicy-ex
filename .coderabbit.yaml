language: en-US
reviews:
  profile: chill
  high_level_summary: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - '^main$'
  path_filters:
    - "!app/src/main/res/values-*/**"
    - "!app/translation/**"
    - "!**/docs/**"
    - "!**/*.md"
    - "!**/generated/**"
    - "!**/*.lock"
    - "!**/node_modules/**"
    - "!**/dist/**"

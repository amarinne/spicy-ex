name: Build & Release Language Model Pack

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1, v2)'
        required: true
        default: 'v1'
      release_name:
        description: 'Release name'
        required: false
        default: 'Language Model Pack'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spicy-ex
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build language model pack
        run: ./gradlew :app:packageLanguageModelPack

      - name: Compute SHA256
        id: sha256
        run: |
          ZIP_PATH=$(find app/build/language-models -name "spicyex-language-models-v1.zip" | head -1)
          echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT
          SHA256=$(sha256sum "$ZIP_PATH" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA256"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.release_name }} ${{ github.event.inputs.version }}
          body: |
            Language model pack for SpicyEX.
            
            **Files included:**
            - jmdict/JmdictFurigana.txt.gz
            - jmdict/JmdictPreferredReadings.txt.gz
            - tika/langdetect-20260320.bin
            - kuromoji/*.bin (8 files)
            
            **SHA256:** ${{ steps.sha256.outputs.sha256 }}
            
            **Usage:**
            ```bash
            ./gradlew :app:assembleDebug \
              -PLANGUAGE_MODEL_PACK_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/spicyex-language-models-v1.zip" \
              -PLANGUAGE_MODEL_PACK_SHA256="${{ steps.sha256.outputs.sha256 }}"
            ```
          files: ${{ steps.sha256.outputs.zip_path }}
          draft: false
          prerelease: false

      - name: Output release URL
        run: |
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.inputs.version }}"
          echo "Download URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.version }}/spicyex-language-models-v1.zip"
          echo "SHA256: ${{ steps.sha256.outputs.sha256 }}"